name: Refresh Financing Market Snapshot

on:
  push:
    branches: [main]
    paths:
      - scripts/refresh-financing-market.js
      - .github/workflows/refresh-financing-market.yml
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-financing-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test financing parser and refresh
        run: node --test test/financing-market.test.js
      - name: Refresh official financing data
        run: npm run update:financing-market
      - name: Commit updated observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/data/financing-market.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh financing market snapshot'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
