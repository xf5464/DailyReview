name: Notify DailyReview Reader

on:
  workflow_run:
    workflows:
      - Deploy Daily Review
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Web Push after a hot-news archive deploy
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          READER_PUSH_TOKEN: ${{ secrets.READER_PUSH_TOKEN }}
        run: |
          if [[ "$HEAD_COMMIT_MESSAGE" != "chore: archive hot news for reader"* ]]; then
            echo "This deploy was not a news archive update; skipping."
            exit 0
          fi
          if [[ -z "$READER_PUSH_TOKEN" ]]; then
            echo "READER_PUSH_TOKEN is not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $READER_PUSH_TOKEN" \
            https://dailyreview-reader.xf5464.workers.dev/push/send
