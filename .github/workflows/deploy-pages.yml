name: Deploy Daily Review

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_alert_check:
        description: Run forecast alert checks and send notifications if needed
        required: false
        default: false
        type: boolean
      test_notifications:
        description: Force-send notification messages even when no alert condition is met
        required: false
        default: false
        type: boolean
      trigger_source:
        description: Trigger source label for alert emails
        required: false
        default: manual
        type: string
      test_email:
        description: Send one Gmail test message after the build
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Apply reader event-ranking UI
        run: node --require ./scripts/register-source-cache.js scripts/patch-reader-event-ranking.js

      - name: Restore conditional source responses
        uses: actions/cache@v4
        with:
          path: .cache/source-responses
          key: source-responses-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-responses-${{ github.workflow }}-
      - name: Restore completed industry boards
        uses: actions/cache/restore@v4
        with:
          path: .cache/industry-boards
          key: industry-boards-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            industry-boards-

      - name: Restore industry history cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/a-share-industry-concentration.json
          key: a-share-industry-history-${{ github.run_id }}
          restore-keys: |
            a-share-industry-history-

      - name: Restore historical chart cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/macro-chart-history.json
          key: macro-chart-history-${{ github.run_id }}
          restore-keys: |
            macro-chart-history-

      - name: Build static site and refresh data
        env:
          CENTRAL_BANK_GOLD_BASE_QUARTERS: ${{ vars.CENTRAL_BANK_GOLD_BASE_QUARTERS }}
          CENTRAL_BANK_GOLD_RISE_THRESHOLD: ${{ vars.CENTRAL_BANK_GOLD_RISE_THRESHOLD }}
          CENTRAL_BANK_GOLD_CONSECUTIVE_QUARTERS: ${{ vars.CENTRAL_BANK_GOLD_CONSECUTIVE_QUARTERS }}
          ISM_NEW_ORDERS_DROP_THRESHOLD: ${{ vars.ISM_NEW_ORDERS_DROP_THRESHOLD }}
          CHINA_FILM_MARGIN_CHANGE_THRESHOLD: ${{ vars.CHINA_FILM_MARGIN_CHANGE_THRESHOLD }}
        run: npm run build

      - name: Save completed industry boards even after failure
        if: always() && hashFiles('.cache/industry-boards/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/industry-boards
          key: industry-boards-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check industry history cache
        id: industry_cache
        run: |
          if test -s .cache/a-share-industry-concentration.json; then echo 'exists=true' >> "$GITHUB_OUTPUT"; fi

      - name: Save refreshed industry history cache
        if: steps.industry_cache.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/a-share-industry-concentration.json
          key: a-share-industry-history-${{ github.run_id }}

      - name: Save historical chart cache
        uses: actions/cache/save@v4
        with:
          path: .cache/macro-chart-history.json
          key: macro-chart-history-${{ github.run_id }}

      - name: Fingerprint reader assets
        run: |
          node --check scripts/fingerprint-reader-assets.js
          node --require ./scripts/register-source-cache.js scripts/fingerprint-reader-assets.js

      - name: Send Gmail test email
        if: (github.event_name == 'workflow_dispatch' && inputs.test_email) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-email]'))
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRIGGER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || '' }}
        run: node --require ./scripts/register-source-cache.js scripts/send-forecast-email.js --test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check forecast alert conditions
        if: github.event_name == 'schedule' || inputs.run_alert_check || inputs.test_notifications
        id: forecast
        env:
          NDX_DRAWDOWN_THRESHOLD: ${{ vars.NDX_DRAWDOWN_THRESHOLD }}
          VIX_THRESHOLD: ${{ vars.VIX_THRESHOLD }}
          UNEMPLOYMENT_THRESHOLD: ${{ vars.UNEMPLOYMENT_THRESHOLD }}
          SAHM_THRESHOLD: ${{ vars.SAHM_THRESHOLD }}
          CENTRAL_BANK_GOLD_BASE_QUARTERS: ${{ vars.CENTRAL_BANK_GOLD_BASE_QUARTERS }}
          CENTRAL_BANK_GOLD_RISE_THRESHOLD: ${{ vars.CENTRAL_BANK_GOLD_RISE_THRESHOLD }}
          CENTRAL_BANK_GOLD_CONSECUTIVE_QUARTERS: ${{ vars.CENTRAL_BANK_GOLD_CONSECUTIVE_QUARTERS }}
          ISM_NEW_ORDERS_DROP_THRESHOLD: ${{ vars.ISM_NEW_ORDERS_DROP_THRESHOLD }}
          CHINA_FILM_MARGIN_CHANGE_THRESHOLD: ${{ vars.CHINA_FILM_MARGIN_CHANGE_THRESHOLD }}
        run: node --require ./scripts/register-source-cache.js scripts/check-forecast-alert.js --output .forecast-alert.json

      - name: Restore per-condition delivery records
        if: steps.forecast.outputs.should_notify == 'true' && !inputs.test_notifications
        id: sent
        uses: actions/cache/restore@v4
        with:
          path: .forecast-delivery
          key: forecast-delivery-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            forecast-delivery-v2-

      - name: Send forecast alert email
        if: ${{ !cancelled() && (inputs.test_notifications || (steps.forecast.outputs.should_notify == 'true' && steps.sent.conclusion == 'success')) }}
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          FORCE_NOTIFICATION_TEST: ${{ inputs.test_notifications }}
        run: node --require ./scripts/register-source-cache.js scripts/send-deduplicated-forecast-alert.js email

      - name: Send WeCom forecast alert
        if: ${{ !cancelled() && (inputs.test_notifications || (steps.forecast.outputs.should_notify == 'true' && steps.sent.conclusion == 'success')) }}
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          FORCE_NOTIFICATION_TEST: ${{ inputs.test_notifications }}
        run: node --require ./scripts/register-source-cache.js scripts/send-deduplicated-forecast-alert.js wecom

      - name: Send Bark forecast alert
        if: ${{ !cancelled() && (inputs.test_notifications || (steps.forecast.outputs.should_notify == 'true' && steps.sent.conclusion == 'success')) }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          FORCE_NOTIFICATION_TEST: ${{ inputs.test_notifications }}
        run: node --require ./scripts/register-source-cache.js scripts/send-deduplicated-forecast-alert.js bark

      - name: Save per-condition delivery records
        if: always() && !inputs.test_notifications && hashFiles('.forecast-delivery/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .forecast-delivery
          key: forecast-delivery-v2-${{ github.run_id }}-${{ github.run_attempt }}
