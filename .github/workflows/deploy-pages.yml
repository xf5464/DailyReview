name: Deploy Daily Review

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_alert_check:
        description: Run forecast alert checks and send notifications if needed
        required: false
        default: false
        type: boolean
      test_notifications:
        description: Force-send notification messages even when no alert condition is met
        required: false
        default: false
        type: boolean
      trigger_source:
        description: Trigger source label for alert emails
        required: false
        default: manual
        type: string
      test_email:
        description: Send one Gmail test message after the build
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build static site and refresh data
        run: npm run build

      - name: Check forecast alert conditions
        if: github.event_name == 'workflow_dispatch' && (inputs.run_alert_check || inputs.test_notifications)
        id: forecast
        env:
          NDX_DRAWDOWN_THRESHOLD: ${{ vars.NDX_DRAWDOWN_THRESHOLD }}
          VIX_THRESHOLD: ${{ vars.VIX_THRESHOLD }}
          UNEMPLOYMENT_THRESHOLD: ${{ vars.UNEMPLOYMENT_THRESHOLD }}
          SAHM_THRESHOLD: ${{ vars.SAHM_THRESHOLD }}
          CENTRAL_BANK_GOLD_BASE_QUARTERS: ${{ vars.CENTRAL_BANK_GOLD_BASE_QUARTERS }}
          CENTRAL_BANK_GOLD_RISE_THRESHOLD: ${{ vars.CENTRAL_BANK_GOLD_RISE_THRESHOLD }}
          CENTRAL_BANK_GOLD_CONSECUTIVE_QUARTERS: ${{ vars.CENTRAL_BANK_GOLD_CONSECUTIVE_QUARTERS }}
        run: node scripts/check-forecast-alert.js --output .forecast-alert.json

      - name: Send forecast alert email
        if: github.event_name == 'workflow_dispatch' && ((inputs.run_alert_check && steps.forecast.outputs.should_notify == 'true') || inputs.test_notifications)
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: node scripts/send-forecast-email.js

      - name: Send WeCom forecast alert
        if: github.event_name == 'workflow_dispatch' && ((inputs.run_alert_check && steps.forecast.outputs.should_notify == 'true') || inputs.test_notifications)
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          FORCE_NOTIFICATION_TEST: ${{ inputs.test_notifications }}
        run: node scripts/send-wechat-alert.js

      - name: Send Bark forecast alert
        if: github.event_name == 'workflow_dispatch' && ((inputs.run_alert_check && steps.forecast.outputs.should_notify == 'true') || inputs.test_notifications)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          FORCE_NOTIFICATION_TEST: ${{ inputs.test_notifications }}
        run: node scripts/send-bark-alert.js

      - name: Send Gmail test email
        if: (github.event_name == 'workflow_dispatch' && inputs.test_email) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-email]'))
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRIGGER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || '' }}
        run: node scripts/send-forecast-email.js --test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
