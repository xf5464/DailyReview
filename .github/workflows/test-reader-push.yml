name: Test Reader Push

on:
  workflow_dispatch:
  push:
    paths:
      - .github/reader-push-trigger

permissions:
  contents: read

concurrency:
  group: test-reader-push
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send one diagnostic push
        env:
          READER_PUSH_TOKEN: ${{ secrets.READER_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$READER_PUSH_TOKEN" ]]; then
            echo "::error::READER_PUSH_TOKEN is not configured."
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(
            curl --silent --show-error               --output "$response_file"               --write-out "%{http_code}"               --request POST               --header "Authorization: Bearer $READER_PUSH_TOKEN"               https://dailyreview-reader.xf5464.workers.dev/push/send
          )"

          echo "Worker HTTP status: $http_status"
          if jq -e . "$response_file" >/dev/null 2>&1; then
            jq . "$response_file"
          else
            sed -n '1,40p' "$response_file"
          fi

          if (( http_status < 200 || http_status >= 300 )); then
            echo "::error::Reader Worker returned HTTP $http_status."
            exit 1
          fi

          subscriptions="$(jq -r '.subscriptions // -1' "$response_file")"
          sent="$(jq -r '.sent // -1' "$response_file")"
          failed="$(jq -r '.failed // -1' "$response_file")"

          if (( subscriptions < 1 )); then
            echo "::error::No saved push subscriptions."
            exit 1
          fi
          if (( sent < 1 || failed > 0 )); then
            echo "::error::Push service rejected the diagnostic notification."
            exit 1
          fi
