name: Refresh A-share Turnover Snapshot

on:
  schedule:
    - cron: "20 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-a-share-turnover
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh persisted snapshot
        run: node scripts/refresh-a-share-turnover-snapshot.js

      - name: Verify snapshot fallback
        run: |
          node --check scripts/refresh-a-share-turnover-snapshot.js
          node --test test/a-share-turnover-snapshot.test.js

      - name: Save snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/a-share-turnover-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh A-share turnover snapshot"
            git pull --rebase origin main
            git push
          fi
