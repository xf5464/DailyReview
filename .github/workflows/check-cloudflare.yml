name: Check Cloudflare Worker Schedules

on:
  push:
    paths:
      - .github/workflows/check-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Cloudflare Workers and Cron Triggers
        env:
          CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_ACCOUNT_ID_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="${CF_TOKEN_1:-${CF_TOKEN_2:-${CF_TOKEN_3:-}}}"
          ACCOUNT_ID="${CF_ACCOUNT_ID_1:-${CF_ACCOUNT_ID_2:-}}"

          auth_args=()
          if [[ -n "$TOKEN" ]]; then
            auth_args=(-H "Authorization: Bearer $TOKEN")
            echo "Authentication: API token"
          elif [[ -n "${CF_API_KEY:-}" && -n "${CF_EMAIL:-}" ]]; then
            auth_args=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_API_KEY")
            echo "Authentication: global API key"
          else
            echo "No supported Cloudflare credential secret was found."
            exit 1
          fi

          api() {
            curl --fail-with-body --silent --show-error "${auth_args[@]}" -H "Content-Type: application/json" "$1"
          }

          if [[ -z "$ACCOUNT_ID" ]]; then
            accounts_json="$(api "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            ACCOUNT_ID="$(printf '%s' "$accounts_json" | jq -r '.result[0].id // empty')"
          fi
          [[ -n "$ACCOUNT_ID" ]] || { echo "Could not determine Cloudflare account ID."; exit 1; }

          echo "Account ID: ${ACCOUNT_ID:0:6}...${ACCOUNT_ID: -4}"
          scripts_json="$(api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts")"
          mapfile -t scripts < <(printf '%s' "$scripts_json" | jq -r '.result[]?.id')
          echo "Workers: ${#scripts[@]}"

          found=0
          for script in "${scripts[@]}"; do
            schedules_json="$(api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$script/schedules" 2>/tmp/cf_schedule_error || true)"
            if [[ -z "$schedules_json" ]]; then
              echo "$script: unable to read schedules"
              continue
            fi

            mapfile -t cron_rows < <(
              printf '%s' "$schedules_json" | jq -r '
                .result | .. | strings
                | select(test("^\\s*([*0-9/,\\-]+\\s+){4}[*0-9/,\\-]+\\s*$"))
              ' | sort -u
            )

            if [[ ${#cron_rows[@]} -gt 0 ]]; then
              found=1
              for cron in "${cron_rows[@]}"; do echo "WORKER=$script CRON=$cron"; done
            else
              echo "$script: no Cron Triggers detected"
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "No Cron Triggers found on readable Workers."
          fi

          echo "--- dailyreview-cron behavior inspection ---"
          script_url="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/dailyreview-cron"
          curl --fail-with-body --silent --show-error "${auth_args[@]}" "$script_url" -o /tmp/dailyreview-cron-worker.txt

          # Print only behavior-relevant lines. Redact long token-like values and authorization headers.
          tr '\r' '\n' < /tmp/dailyreview-cron-worker.txt \
            | grep -E -i -C 3 'scheduled|controller\.cron|cron|\*/30|17 4|17 10|17 16|17 22|fetch\(|github|actions|workflow|dispatch|hot-news|refresh|reader' \
            | sed -E 's/(Authorization: Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/Ig; s/([A-Za-z0-9_=-]{32,})/[REDACTED]/g' \
            | head -n 240 || true
