name: Test market report to existing WeCom group

on:
  push:
    branches: [codex/market-report-wecom]
    paths: [.github/workflows/test-market-wecom.yml]
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send market report test
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          REPORT_TEXT: |
            [美股每日监测·测试]
            这是向原“个人自动化通知”群发送的测试消息。
            
            数据：美东2026-11-20正式收盘（11月21日周末休市）。
            
            标普500
            当前：6,910.39；回撤：11.62%
            历史最高收盘：7,818.93（2026-10-06）
            跌10%：7,037.04 🟢
            跌15%：6,646.09
            跌20%：6,255.14
            跌25%：5,864.20
            跌30%：5,473.25
            
            纳斯达克综合指数
            当前：22,617.73；回撤：18.05%
            历史最高收盘：27,599.79（2026-10-06）
            跌10%：24,839.81 🟢
            跌15%：23,459.82 🟢
            跌20%：22,079.83
            跌25%：20,699.84
            跌30%：19,319.85
            
            纳斯达克100
            当前：25,028.98；回撤：19.84%
            历史最高收盘：31,224.69（2026-10-06）
            跌10%：28,102.22 🟢
            跌15%：26,540.99 🟢
            跌20%：24,979.75
            跌25%：23,418.52
            跌30%：21,857.28
            
            VIX现货
            收盘：35.89
            当日最高：40.03；最低：26.94
            涨跌：+7.45（+26.20%）
            
            159941溢价率：暂缺。尚未核实同日官方收盘价与基金净值，不填推测值。
            
            回撤均相对历史最高收盘计算，🟢表示当前达到该档。
            来源：
            https://apnews.com/article/wall-street-stocks-dow-nasdaq-c10b797a17c2acf37924d834efebe135
            https://indexes.nasdaq.com/Index/Overview/NDX
            https://www.davemanuel.com/where-did-the-djia-nasdaq-sp500-trade-on.php
            https://en.wikipedia.org/wiki/Nasdaq-100
            https://finance.yahoo.com/quote/%5EVIX/history/
            本条为手动推送测试。
        run: |
          node <<'NODE'
          (async () => {
            const hook = process.env.WECHAT_WEBHOOK;
            if (!hook) throw new Error("WECHAT_WEBHOOK is not configured");
            const content = process.env.REPORT_TEXT;
            if (Buffer.byteLength(content, "utf8") > 2048) {
              // WeCom text messages support up to 2048 UTF-8 bytes.
              throw new Error("Report exceeds WeCom text message limit");
            }
            let response;
            try {
              response = await fetch(hook, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({msgtype:"text", text:{content}}),
                signal: AbortSignal.timeout(20000)
              });
            } catch { throw new Error("WeCom request failed"); }
            if (!response.ok) throw new Error("WeCom HTTP " + response.status);
            const result = await response.json();
            if (result.errcode !== 0) throw new Error("WeCom rejected message, code " + result.errcode);
            console.log("WeCom market report test sent successfully (errcode=0).");
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
