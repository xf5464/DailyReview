name: Send commodity report to dedicated WeCom group

on:
  push:
    branches: [codex/market-report-wecom]
    paths:
      - reports/commodity-daily.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commodity-report-wecom
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chart dependencies
        run: |
          python -m pip install matplotlib==3.10.8
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Render five commodity drawdown charts
        run: python scripts/render-a-share-report.py --market commodity --data reports/commodity-chart-data.json --report reports/commodity-daily.txt --output commodity-report-images
      - name: Save report charts
        uses: actions/upload-artifact@v4
        with:
          name: commodity-one-year-charts
          path: commodity-report-images/
          retention-days: 14
      - name: Send five integrated commodity images
        env:
          WECHAT_WEBHOOK: ${{ secrets.MARKET_WECHAT_WEBHOOK }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const hook = process.env.WECHAT_WEBHOOK;
            if (!hook) throw new Error('MARKET_WECHAT_WEBHOOK is not configured');
            const manifest = JSON.parse(fs.readFileSync('commodity-report-images/manifest.json', 'utf8'));
            const expectedCodes = ['NG=F', 'BZ=F', 'gold', 'SI=F', 'HG=F'];
            if (JSON.stringify(manifest.map(m => m.code)) !== JSON.stringify(expectedCodes)) throw new Error('Invalid commodity chart order');
            const images = manifest.map(m => {
              if (m.file !== 'commodity-' + m.code + '-1y.png') throw new Error('Invalid chart filename');
              const bytes = fs.readFileSync('commodity-report-images/' + m.file);
              if (!bytes.length || bytes.length >= 2 * 1024 * 1024 || bytes.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a') throw new Error('Invalid PNG');
              return {msgtype: 'image', image: {base64: bytes.toString('base64'), md5: crypto.createHash('md5').update(bytes).digest('hex')}};
            });
            const messages = images;
            // Validate every payload before sending; do not retry uncertain deliveries.
            for (let i = 0; i < messages.length; i++) {
              let response;
              try {
                response = await fetch(hook, {method: 'POST', headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(messages[i]), signal: AbortSignal.timeout(20000)});
              } catch { throw new Error('WeCom request failed at message ' + (i + 1) + '; check delivery before retrying'); }
              if (!response.ok) throw new Error('WeCom HTTP ' + response.status + ' at message ' + (i + 1));
              const result = await response.json();
              if (result.errcode !== 0) throw new Error('WeCom rejected message ' + (i + 1) + ', code ' + result.errcode);
              console.log('WeCom ' + messages[i].msgtype + ' ' + (i + 1) + '/' + messages.length + ' sent successfully (errcode=0).');
            }
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
