name: Refresh Reader News

on:
  push:
    paths:
      - .github/hot-news-refresh-trigger
  workflow_dispatch:
    inputs:
      window_hours:
        description: News lookback window (12-72 hours)
        required: false
        default: "30"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: send-hot-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          node --check scripts/refresh-reader-news.js
          node --check scripts/refresh-reader-aggregated.js
          node --check scripts/patch-reader-event-ranking.js

      - name: Fetch and aggregate current headlines
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HOT_NEWS_WINDOW_HOURS: ${{ inputs.window_hours || '30' }}
          HOT_NEWS_REFRESH_ONLY: "true"
          HOT_NEWS_ARCHIVE_PATH: site/reader/data/recent.json
        run: |
          for attempt in 1 2 3; do
            if node scripts/refresh-reader-aggregated.js; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Save the reader news archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/reader/data/recent.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh reader news archive"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Deploy the refreshed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
