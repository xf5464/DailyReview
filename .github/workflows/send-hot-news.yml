name: Hot News Compatibility

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Compatibility label from Cloudflare or manual callers
        required: false
        default: "compat"
        type: string
      window_hours:
        description: News lookback window (12-72 hours)
        required: false
        default: "30"
        type: string
      refresh_only:
        description: Legacy compatibility flag; refreshes now use the unified reader pipeline
        required: false
        default: "true"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: send-hot-news-compat
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Forward to the unified collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-dailyreview.yml --repo "$GITHUB_REPOSITORY" --ref main
