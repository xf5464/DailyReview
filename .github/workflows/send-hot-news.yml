name: Send Hot News

on:
  push:
    paths:
      - .github/hot-news-trigger
  workflow_run:
    workflows:
      - Deploy Daily Review
    types:
      - completed
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source shown in the email
        required: false
        default: manual
        type: string
      window_hours:
        description: News lookback window (12-72 hours)
        required: false
        default: "30"
        type: string

permissions:
  contents: write

concurrency:
  group: send-hot-news
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide whether this run should send
        id: gate
        env:
          COMPLETED_WORKFLOW_RESULT: ${{ github.event.workflow_run.conclusion }}
          COMPLETED_WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          elif [[ "$COMPLETED_WORKFLOW_RESULT" == "success" && "$COMPLETED_WORKFLOW_EVENT" == "workflow_dispatch" ]]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.should_send == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.should_send == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.should_send == 'true'
        run: npm ci

      - name: Test
        if: steps.gate.outputs.should_send == 'true'
        run: npm test

      - name: Fetch hot news and send Gmail
        if: steps.gate.outputs.should_send == 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRIGGER_SOURCE: ${{ github.event_name == 'workflow_run' && 'cloudflare' || github.event_name == 'workflow_dispatch' && inputs.trigger_source || 'github-trigger-file' }}
          HOT_NEWS_WINDOW_HOURS: ${{ inputs.window_hours || '30' }}
          READER_BASE_URL: ${{ vars.READER_BASE_URL }}
          HOT_NEWS_ARCHIVE_PATH: site/reader/data/recent.json
        run: node scripts/send-hot-news-email.js

      - name: Save the latest three days to the repository
        if: steps.gate.outputs.should_send == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/reader/data/recent.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: archive hot news for reader"
          git push

      - name: Notify subscribed readers
        if: steps.gate.outputs.should_send == 'true'
        env:
          READER_PUSH_TOKEN: ${{ secrets.READER_PUSH_TOKEN }}
        run: |
          if [[ -z "$READER_PUSH_TOKEN" ]]; then
            echo "READER_PUSH_TOKEN is not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $READER_PUSH_TOKEN" \
            https://dailyreview-reader.xf5464.workers.dev/push/send
