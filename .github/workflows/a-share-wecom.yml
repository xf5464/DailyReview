name: Send A-share report to dedicated WeCom group

on:
  push:
    branches: [codex/market-report-wecom]
    paths:
      - reports/a-share-daily.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-share-report-wecom
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send A-share report
        env:
          WECHAT_WEBHOOK: ${{ secrets.MARKET_WECHAT_WEBHOOK }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          (async () => {
            const hook = process.env.WECHAT_WEBHOOK;
            if (!hook) throw new Error("MARKET_WECHAT_WEBHOOK is not configured; add the dedicated market group webhook in repository Actions secrets");
            const content = fs.readFileSync("reports/a-share-daily.txt", "utf8").trim();
            if (!content) throw new Error("Empty market report");
            const marker = /^A股市场指标｜/m;
            const boundary = content.search(marker);
            if (boundary < 0) throw new Error("Missing separate market indicators section");
            const chunks = [content.slice(0, boundary).trim(), content.slice(boundary).trim()];
            // Validate both messages before sending either one.
            if (chunks.some(part => !part || Buffer.byteLength(part, "utf8") > 2000)) {
              throw new Error("Each A-share report section must be nonempty and at most 2000 UTF-8 bytes");
            }
            for (let i = 0; i < chunks.length; i++) {
              let response;
              try {
                response = await fetch(hook, {
                  method: "POST",
                  headers: {"Content-Type": "application/json"},
                  body: JSON.stringify({msgtype:"text", text:{content:chunks[i]}}),
                  signal: AbortSignal.timeout(20000)
                });
              } catch { throw new Error("WeCom request failed; check group before retrying"); }
              if (!response.ok) throw new Error("WeCom HTTP " + response.status);
              const result = await response.json();
              if (result.errcode !== 0) throw new Error("WeCom rejected message, code " + result.errcode);
              console.log("WeCom report part " + (i + 1) + "/" + chunks.length + " sent successfully (errcode=0).");
            }
          })().catch(e => { console.error(e.message); process.exitCode = 1; });
          NODE
